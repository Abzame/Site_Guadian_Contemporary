<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Contemporary Guardian Real Estate Portugal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

    
    <div id="site-header"></div>


    <div class="hero-banner">
        <h2>Onde a Tradição Encontra o Seu Espaço Exclusivo</h2>
        <p>Encontre excelência em propriedades exclusivas selecionadas para si.</p>
    </div>


    <!-- Caixa de Pesquisa Funcional na Página Inicial -->
    <div class="search-box-home">
        <select id="homeTipo">
            <option value="">Todos os Tipos</option>
            <option value="Moradia">Moradia</option>
            <option value="Apartamento">Apartamento</option>
            <option value="Quinta">Quinta</option>
        </select>
        <select id="homeLocal">
            <option value="">Todas as Localizações</option>
            <option value="Santarém">Santarém</option>
            <option value="Lisboa">Lisboa</option>
            <option value="Évora">Évora</option>
            <option value="Cascais">Cascais</option>
            <option value="Coimbra">Coimbra</option>
            <option value="Porto">Porto</option>
        </select>
        <button onclick="executarPesquisaHome()">Pesquisar Imóveis</button>
    </div>

    <main class="container">
        <h2 class="section-title">Imóveis em Destaque</h2>
        <div class="grid-imoveis" id="gridDestaques">
            <!-- Carregado via JavaScript a partir do JSON -->
        </div>
    </main>

    <footer>
        <h3>Contemporary Guardian Real Estate Portugal</h3>
        <p>Email: contemporaryguardian@gmail.com</p>
        <p style="margin-top: 1.5rem; font-size: 0.8rem; color: #555;">&copy; 2026 Contemporary Guardian. Todos os direitos reservados.</p>
    </footer>


    <script src="static/scripts.js"></script>

</body>
