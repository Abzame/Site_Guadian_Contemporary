<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Imóvel - Contemporary Guardian</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

    <!-- O cabeçalho é injetado automaticamente pelo scripts.js -->
    <div id="site-header"></div>

    <main class="container" style="margin-top: 3rem;">
        <!-- Grelha de Detalhes (Carrossel à esquerda, Informações e Preço à direita) -->
        <div id="detalheImovel" style="display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: start;">
            <!-- Preenchido dinamicamente via JavaScript -->
        </div>
    </main>

    <footer style="margin-top: 4rem;">
        <h3>Contemporary Guardian Real Estate Portugal</h3>
        <p>Email: cgp@cgimobiliaria.com</p>
        <p style="margin-top: 1.5rem; font-size: 0.8rem; color: #555;">&copy; 2026 Contemporary Guardian. Todos os direitos reservados.</p>
    </footer>

    <!-- Modal Full Screen com Setas e Miniaturas -->
    <div id="modalFullscreen" class="modal-fullscreen">
        <button class="modal-fechar" onclick="fecharFullscreen()">&times;</button>
        <button class="modal-btn-seta modal-btn-prev" onclick="mudarImagemFullscreen(-1)">&#10094;</button>
        
        <img class="modal-fullscreen-img" id="imgModalSrc" src="" alt="Imagem Ampliada">
        
        <button class="modal-btn-seta modal-btn-next" onclick="mudarImagemFullscreen(1)">&#10095;</button>
        
        <!-- Miniaturas em baixo no Fullscreen -->
        <div class="modal-miniaturas-container" id="modalContainerMiniaturas"></div>
    </div>

    <script src="static/scripts.js"></script>
</body>
</html>
